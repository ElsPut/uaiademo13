# This is a basic workflow to help you get started with Actions

name: deploy-sa
on:
  workflow_dispatch:
  
env:
 AZ_RGNAME: RG4
 AZ_RGLOC: SwedenCentral
 
 
permissions:
 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: sign in to Azure
        uses: azure/login@v3
        with:
          client-id: 
          tenant-id: 
          subscription-id: 

      - name: deploy RG
        uses: azure/cli@v3
        with:
         inlineScript:
          az group create --name ${{env.AZ_RGNAME}}  --location ${{env.AZ_RGLOC}}
          
      - name: deploy storage
        uses: azure/arm-deploy@v2
        with:
         deploymentName: ${{github.run_Number}}
         resourceGroupName: ${{env.AZ_RGNAME}}
         template: ./storage.bicep
